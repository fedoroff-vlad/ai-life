spring:
  application:
    name: mcp-travel
  datasource:
    url: ${MCP_TRAVEL_DB_URL:jdbc:postgresql://localhost:5432/ailife}
    username: ${MCP_TRAVEL_DB_USER:ailife}
    password: ${MCP_TRAVEL_DB_PASSWORD:ailife}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.json_format_mapper: dev.fedorov.ailife.common.jackson.Jackson3JsonFormatMapper
  ai:
    mcp:
      server:
        name: ai-life-travel
        version: 0.0.1
        type: ASYNC
        instructions: >
          Source-of-truth travel CRUD over Postgres travel.* schema. Per-person travel
          preferences (travel_profile: home base label + geocoded lat/lon, preferred rest
          types beach|active|family|couple|city|ski|wellness, companions solo|couple|family,
          optional child ages, and a soft budget hint). The gather → synthesize trip-planning
          flow lives in travel-agent; this MCP just persists.

server:
  port: ${MCP_TRAVEL_PORT:8123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    dev.fedorov.ailife: DEBUG

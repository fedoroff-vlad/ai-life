spring:
  application:
    name: travel-agent
  main:
    web-application-type: reactive
  ai:
    mcp:
      client:
        # Binds mcp-travel (its data) + the shared mcp-weather / mcp-web so a future LLM-driven flow
        # can pick their tools. The deterministic flows call the capabilities over their HTTP /internal
        # passthroughs instead. Toggle off in dev/degraded envs.
        enabled: ${TRAVEL_AGENT_MCP_CLIENT_ENABLED:true}
        toolcallback:
          enabled: true
        sse:
          connections:
            mcp-travel:
              url: ${MCP_TRAVEL_URL:http://mcp-travel:8123}
            mcp-weather:
              url: ${MCP_WEATHER_URL:http://mcp-weather:8113}
            mcp-web:
              url: ${MCP_WEB_URL:http://mcp-web:8098}

server:
  port: ${TRAVEL_AGENT_PORT:8124}

agent:
  manifest-classpath: AGENT.md
  skills-classpath: classpath*:skills/travel/*/SKILL.md
  memory-recall-k: ${TRAVEL_AGENT_MEMORY_RECALL_K:5}

travel-agent:
  mcp-travel-url: ${MCP_TRAVEL_URL:http://mcp-travel:8123}
  mcp-weather-url: ${MCP_WEATHER_URL:http://mcp-weather:8113}
  mcp-web-url: ${MCP_WEB_URL:http://mcp-web:8098}
  orchestrator-url: ${ORCHESTRATOR_URL:http://orchestrator:8083}
  profile-service-url: ${PROFILE_SERVICE_URL:http://profile-service:8082}
  notifier-url: ${NOTIFIER_URL:http://notifier-service:8084}
  memory-service-url: ${MEMORY_SERVICE_URL:http://memory-service:8087}

ailife:
  llm-client:
    base-url: ${LLM_GATEWAY_URL:http://llm-gateway:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    dev.fedorov.ailife: DEBUG

spring:
  application:
    name: inventory-agent
  main:
    web-application-type: reactive
  ai:
    mcp:
      client:
        # Binds mcp-inventory (its data) + the shared mcp-media-processing so a future LLM-driven flow
        # can pick their tools. The deterministic flows call them over their HTTP /internal
        # passthroughs instead. Toggle off in dev/degraded envs.
        enabled: ${INVENTORY_AGENT_MCP_CLIENT_ENABLED:true}
        toolcallback:
          enabled: true
        sse:
          connections:
            mcp-inventory:
              url: ${MCP_INVENTORY_URL:http://mcp-inventory:8127}
            mcp-media-processing:
              url: ${MCP_MEDIA_PROCESSING_URL:http://mcp-media-processing:8097}

server:
  port: ${INVENTORY_AGENT_PORT:8128}

agent:
  manifest-classpath: AGENT.md
  skills-classpath: classpath*:skills/inventory/*/SKILL.md
  memory-recall-k: ${INVENTORY_AGENT_MEMORY_RECALL_K:5}

inventory-agent:
  mcp-inventory-url: ${MCP_INVENTORY_URL:http://mcp-inventory:8127}
  mcp-media-processing-url: ${MCP_MEDIA_PROCESSING_URL:http://mcp-media-processing:8097}
  media-service-url: ${MEDIA_SERVICE_URL:http://media-service:8088}
  # Externally-reachable base for the label/card links the owner opens; defaults to the internal URL.
  public-media-base-url: ${INVENTORY_PUBLIC_MEDIA_BASE_URL:${MEDIA_SERVICE_URL:http://media-service:8088}}
  # The bot the printed label's deep link points at — the same value gateway-telegram mints invites with.
  telegram-bot-username: ${GATEWAY_TELEGRAM_BOT_USERNAME:ai_life_bot}
  profile-service-url: ${PROFILE_SERVICE_URL:http://profile-service:8082}
  notifier-url: ${NOTIFIER_URL:http://notifier-service:8084}
  memory-service-url: ${MEMORY_SERVICE_URL:http://memory-service:8087}

ailife:
  llm-client:
    base-url: ${LLM_GATEWAY_URL:http://llm-gateway:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    dev.fedorov.ailife: DEBUG

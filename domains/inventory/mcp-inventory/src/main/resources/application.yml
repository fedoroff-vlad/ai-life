spring:
  application:
    name: mcp-inventory
  datasource:
    url: ${MCP_INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/ailife}
    username: ${MCP_INVENTORY_DB_USER:ailife}
    password: ${MCP_INVENTORY_DB_PASSWORD:ailife}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.json_format_mapper: dev.fedorov.ailife.common.jackson.Jackson3JsonFormatMapper
  ai:
    mcp:
      server:
        name: ai-life-inventory
        version: 0.0.1
        type: ASYNC
        instructions: >
          Source-of-truth physical-storage store over Postgres inventory.* schema: storage zones
          (кладовка/гараж/дача), QR-labelled containers (boxes/shelves) and the photographed items
          inside them. Answers "what is in this container" (by id or by the label's qrToken) and
          "where does this thing live" (free-text search over item titles). The photo capture, the
          vision caption and the QR rendering/decoding live in inventory-agent; this MCP just
          persists and searches.

server:
  port: ${MCP_INVENTORY_PORT:8127}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    dev.fedorov.ailife: DEBUG

# ai-life change-map — drop this at the repo root as .skills/change-map.yaml
# Derived from ai-life/CLAUDE.md "Change-propagation map". Keep in sync when a
# new mechanically-checkable coupling appears (this replaces the hand checklist).
version: 1
couplings:
  - id: llm-model-tag
    trigger: Changed the LLM model / tag
    ssot: infra/.env.mac.example
    must_update:
      - infra/.env.example
      - scripts/golden.sh
      - platform/llm-gateway/README.md
      - plans/lifecycle.md
      - plans/architecture.md
      - plans/model-strategy.md          # per-channel model picks table + rollout — restates the tags
    revalidate:
      - golden lane
    notes: >
      Retiring a tag → add it to RETIRED_TAGS in scripts/check-consistency.sh.
      plans/architecture.md holds the model list in §LLM strategy + the host size in
      its header blockquote — both must track the SSOT (drift caught 2026-07-16).

  - id: embedding-model-dimension
    trigger: Changed the embedding model or its vector dimension
    ssot: infra/.env.mac.example
    must_update:
      - infra/.env.example                                        # MEMORY_EMBED_DIM default + commented Mac block
      - infra/liquibase/features/091-memory-embed-768.yml         # vector(N) column width (or a new embed-NNNN migration)
      - platform/memory-service/src/main/resources/application.yml # memory.dim default
      - platform/memory-service/README.md                          # dim contract + "Dim mismatch" note
      - plans/platform.md                                          # memory-service embedding-channel prose
      - platform/llm-gateway/README.md                             # embedding-model example (also in llm-model-tag)
      - plans/model-strategy.md                                    # embedding channel pick + the dim-change reindex note
    notes: >
      Swapping the embedding model changes the dim, the vector(N) column AND the
      LIQUIBASE_CONTEXTS that gates the widen migration. Three knobs move as one:
      LLM_EMBEDDING_MODEL ↔ MEMORY_EMBED_DIM ↔ vector(N) in the context-gated
      embed-NNN migration. The mock/dev default stays 384 (004-memory, no context);
      only the real-provider deploy overrides all three. A new dim (e.g. bge-m3 =
      1024) needs its own embed-1024 context + migration — do NOT amend 091.
      Mechanized (partly): scripts/check-consistency.sh check 3 asserts
      MEMORY_EMBED_DIM ↔ the embed-NNN context ↔ the migration's ALTER … vector(N)
      agree in infra/.env.mac.example. The model↔dim half and the other doc knobs
      stay a human checklist.

  - id: new-service-or-mcp-module
    trigger: Added a new service or MCP module
    must_update:
      - infra/docker-compose*.yml
      - README.md
      - "<module>/README.md"
      - plans/architecture.md
      - plans/INDEX.md
      - "<module>/.env.example"
    revalidate:
      - golden test if the module has an LLM surface

  - id: new-env-port-endpoint-tool
    trigger: Added a new env var / port / endpoint / MCP tool
    must_update:
      - "<module>/README.md"
      - "<module>/.env.example"
      - "<consumer>/README.md (§who-uses-me)"

  - id: new-wire-contract
    trigger: Added or changed a cross-service wire contract in libs/contracts
    ssot: libs/contracts
    must_update:
      - both sides' code
      - "E2E<Stage/Feature>...Test"

  - id: model-profile-cross-repo
    trigger: Changed the /v1/model-profile contract (profile names, status semantics, ordering)
    ssot: platform/llm-gateway/src/main/java/dev/fedorov/ailife/llmgw/model/ModelProfileService.java
    must_update:
      - platform/llm-gateway/src/test/java/dev/fedorov/ailife/llmgw/model/ModelProfileServiceTest.java
      - platform/llm-gateway/README.md          # §Model profile — the operator-facing contract
      - infra/.env.example
      - infra/.env.mac.example
      - infra/docker-compose.yml                # the llm-gateway env block
      - plans/lifecycle.md                      # §LC-4
      - ../coding-agent/src/code_context/lifecycle.py   # the CALLER, in a DIFFERENT repo/PR
    notes: >
      The only contract ai-life shares with another repository, so neither CI can see the other
      half and drift here is silent by construction. Two invariants the caller depends on: a 2xx
      means the outgoing model has ACTUALLY left Ollama (not that the request was accepted), and
      any other status — including the 404 when the feature is off — must keep reading as a
      refusal. Weakening either one lets both models load at once, which is the failure the whole
      mechanism exists to prevent.

  - id: ingestion-source
    trigger: >
      Added or changed a surface that folds untrusted external text into an LLM prompt
      (web fetch/search, OCR of user files, audio transcript, feed/reddit/youtube pull,
      recalled ambient note) — a new prompt-injection entry point.
    ssot: libs/agent-runtime/src/main/java/dev/fedorov/ailife/agentruntime/coordinate/UntrustedContent.java
    must_update:
      - the flow's prompt assembly            # include UntrustedContent.GUARD as a system prompt (fence values spliced into free text)
      - a Golden…InjectionResistanceTest       # ONLY for a new ingestion *mechanism* — see notes
      - plans/architecture.md                  # §Security ingestion checklist (provenance · framed-as-data · outbound-behind-confirm · third-party-MCP-reviewed)
    notes: >
      The inbound half of the untrusted-input doctrine (architecture.md §Security). To an LLM,
      retrieved text is indistinguishable from instructions; the outbound confirm-gate only stops
      the *act*, so every ingestion surface must frame its content as DATA at the prompt
      (UntrustedContent.GUARD). **Golden scope:** the injection golden proves the *mechanism*
      (GUARD + Coordinator/chat), so it is written ONCE per mechanism. Two proven so far:
      GoldenResearchInjectionResistanceTest (GUARD + Coordinator JSON corpus, reused by every web synthesis
      flow) and GoldenDocArchiverInjectionResistanceTest (GUARD + fence on a direct llm.chat where OCR text
      is spliced into free text — the docs path). A flow reusing one of these needs GUARD but not a new
      golden; a genuinely *new* mechanism (different transport, or a new splice shape) does. **What the
      golden asserts:** the injection cannot make the agent emit the attacker's chosen content (no marker in
      the reply or any model-derived field) — NOT that extraction still succeeds. A weak model may fail
      *safe* under injection (empty output → generic save); that is denial, not a hijack, so the security
      contract is no-hijack, and extraction robustness is a deploy-model quality property. Free-text splices
      also get UntrustedContent.fence (a JSON corpus field is already self-labeling). Mechanized:
      scripts/check-consistency.sh check 7 fails CI when a *-agent flow makes an LLM call (coordinate()/chat())
      and ingests web (WebSearchClient/PageFetchClient) or OCR (OcrClient) content but omits GUARD. All flows
      migrated (#599); GUARD_ALLOWLIST is empty.

  - id: skills-pointer
    trigger: Changed the reusable-skills wiring
    must_update:
      - CLAUDE.md (Reusable dev-workflow skills block)
      - .skills/change-map.yaml
    notes: The tools/agent-skills pointer + index must exist and match across docs.

  - id: epic-status
    trigger: Changed an epic's / stage's progress status (started, shipped a slice, closed it)
    ssot: >
      the ADR header (for ADR-backed epics) OR the roadmap.md bullet; plus STATUS.md while in flight.
      Pick ONE and make the others link to it — do not restate the status word in more than one place.
    must_update:
      - plans/STATUS.md            # while in flight (move to HISTORY.md on close)
      - plans/roadmap.md           # the epic/stage bullet
      - plans/adr/ADR-*.md         # header + Action Items, if ADR-backed
      - README.md                  # ONLY if it carries an epic-status line — prefer a pointer, not a restatement
    must_not_update:
      - plans/INDEX.md             # statusless map by rule — enforced by check-consistency.sh check 4
    notes: >
      This is the drift that bit us 2026-08-08: DS-N shipped but 4 derivative docs still said
      "deferred". The fix is fewer restatements, not more edits — one source of truth per epic
      status, everything else links. The mechanizable half (INDEX must stay statusless) is
      enforced by check-consistency.sh check 4; the rest is judgement — keep README/roadmap
      pointing at the ADR header rather than duplicating its status.

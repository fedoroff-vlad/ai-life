databaseChangeLog:

  - changeSet:
      id: 112-travel-route
      author: ai-life
      comment: |
        Route/itinerary import store (plans/travel.md §Route import, #436, RT-a). One table in the travel
        schema:

          route — an imported route/itinerary. Household-scoped; optionally attached to a trip_id
                  (cascade-deletes with the trip). source_format is the format it came from
                  (gpx|geojson|kml|kmz). geometry is a normalized jsonb blob
                  {track:[{lat,lon,elevationM?}], waypoints:[{lat,lon,elevationM?,name?}]} — same jsonb
                  pattern as travel_profile.rest_types. point_count and distance_m (metres, haversine over
                  the track) are derived at import for cheap board display.

        Parsing is zero-dependency JDK (GeoJSON via Jackson, GPX via StAX) in mcp-travel; this migration
        only persists the result.
      changes:
        - createTable:
            schemaName: travel
            tableName: route
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: household_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_route_household
                    referencedTableSchemaName: core
                    referencedTableName: households
                    referencedColumnNames: id
              - column:
                  name: trip_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_route_trip
                    referencedTableSchemaName: travel
                    referencedTableName: trip
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: source_format
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: point_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: distance_m
                  type: numeric(19,4)
              - column:
                  name: geometry
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: imported_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: travel
            tableName: route
            indexName: ix_route_household
            columns:
              - column:
                  name: household_id
        - createIndex:
            schemaName: travel
            tableName: route
            indexName: ix_route_trip
            columns:
              - column:
                  name: trip_id

        - sql:
            stripComments: false
            sql: |
              ALTER TABLE travel.route
                ADD CONSTRAINT ck_route_point_count CHECK (point_count >= 0);
              ALTER TABLE travel.route
                ADD CONSTRAINT ck_route_distance CHECK (distance_m IS NULL OR distance_m >= 0);

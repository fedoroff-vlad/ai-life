      CALENDAR_WEB_FUTURE_DAYS: ${CALENDAR_WEB_FUTURE_DAYS:-366}
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8113 && printf ''GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 ''']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Public HTTPS for calendar-web via Tailscale Funnel (#195). Off by default — enabled with the
  # "tunnel" profile once TS_AUTHKEY is set (one-time): `docker compose --profile tunnel up`.
  # The feed URL is then https://ai-life-calendar.<your-tailnet>.ts.net/ics/<token>.ics
  tailscale-calendar:
    image: tailscale/tailscale:latest
    container_name: ai-life-tailscale-calendar
    hostname: ai-life-calendar
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      calendar-web:
        condition: service_healthy
    environment:
      <<: *internal-secret
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --reset
    volumes:
      - tailscale-calendar-state:/var/lib/tailscale
      - ./tailscale/calendar-serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
      - sys_module

volumes:
  postgres-data:
  radicale-data:
  seaweedfs-data:
  grafana-data:
  tailscale-calendar-state:

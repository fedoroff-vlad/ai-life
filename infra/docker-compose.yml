      start_period: 30s

  # ---------- agents ----------
  # ONE JVM, six agent contexts — replaces the former calendar / finance / tasks / notes /
  # coordinator / researcher agent services (#584 slice 3r). Each context keeps its own port, so the
  # orchestrator's six *_AGENT_URL values are unchanged; this container takes the old service names
  # as NETWORK ALIASES so they still resolve. Keep the alias list equal to AgentHost.RESIDENT_HOT
  # (check-consistency.sh check 18 enforces it).
  #
  # Nothing in compose depends_on an agent, so unlike the domain-MCP cutover (3p) this moves no
  # dependency edges at all — only the six service definitions collapse into this one.
  #
  # Rollback is `git revert` of this slice: the six agent Dockerfiles and their `-exec` jars are
  # untouched, so the separate services still build and run.
  agent-host:
    profiles: ["hot"]
    image: ai-life/agent-host:local
    container_name: ai-life-agent-host
    build:
      context: ..
      dockerfile: deploy/agent-host/Dockerfile
    restart: unless-stopped
    networks:
      default:
        aliases:
          - calendar-agent
          - finance-agent
          - tasks-agent
          - notes-agent
          - coordinator-agent
          - researcher-agent
    # The union of the six agents' dependencies.
    depends_on:
      llm-gateway:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      notifier-service:
        condition: service_healthy
      memory-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      domain-mcp-host:
        condition: service_healthy
      mcp-media-fetch:
        condition: service_healthy
    # The union of the six agents' environment: 34 unique keys, verified conflict-free (no key
    # appears twice with a different value) — a property to re-check when a member joins.
    environment:
      <<: *internal-secret
      # Deliberately NOT *jvm-opts (-Xmx768m, sized for one module per process): six contexts share
      # this heap. Provisional headroom — the six measured 2787 MB as separate JVMs.
      JAVA_TOOL_OPTIONS: "-Xmx2560m"
      # calendar-agent
      CALENDAR_AGENT_PORT: 8086
      LLM_GATEWAY_URL: http://llm-gateway:8081
      PROFILE_SERVICE_URL: http://profile-service:8082
      NOTIFIER_URL: http://notifier-service:8084
      MEMORY_SERVICE_URL: http://memory-service:8087
      MCP_CALDAV_URL: http://mcp-caldav:8090
      MCP_ICS_IMPORT_URL: http://mcp-ics-import:8091
      CALENDAR_PUBLIC_BASE_URL: ${CALENDAR_PUBLIC_BASE_URL:-}
      # finance-agent
      FINANCE_AGENT_PORT: 8093
      MEDIA_SERVICE_URL: http://media-service:8088
      FINANCE_AGENT_MEMORY_RECALL_K: ${FINANCE_AGENT_MEMORY_RECALL_K:-5}
      MCP_FINANCE_URL: http://mcp-finance:8092
      MCP_MONEY_PRO_IMPORT_URL: http://mcp-money-pro-import:8094
      MCP_MEDIA_PROCESSING_URL: http://mcp-media-processing:8097
      MARKET_DATA_URL: http://mcp-market-data:8100
      MCP_CHART_RENDER_URL: http://mcp-chart-render:8120
      FINANCE_AGENT_MCP_CLIENT_ENABLED: ${FINANCE_AGENT_MCP_CLIENT_ENABLED:-true}
      # tasks-agent
      TASKS_AGENT_PORT: 8096
      MCP_TASKS_URL: http://mcp-tasks:8095
      TASKS_AGENT_MCP_CLIENT_ENABLED: ${TASKS_AGENT_MCP_CLIENT_ENABLED:-true}
      TASKS_AGENT_MEMORY_RECALL_K: ${TASKS_AGENT_MEMORY_RECALL_K:-5}
      # notes-agent
      NOTES_AGENT_PORT: 8118
      SCHEDULER_URL: http://scheduler-service:8085
      NOTES_AGENT_MEMORY_RECALL_K: ${NOTES_AGENT_MEMORY_RECALL_K:-5}
      NOTES_RESURFACE_OLDER_THAN_DAYS: ${NOTES_RESURFACE_OLDER_THAN_DAYS:-30}
      NOTES_RESURFACE_CRON: ${NOTES_RESURFACE_CRON:-0 0 10 * * MON}
      # coordinator-agent
      COORDINATOR_AGENT_PORT: 8119
      ORCHESTRATOR_URL: http://orchestrator:8083
      COORDINATOR_AGENT_MEMORY_RECALL_K: ${COORDINATOR_AGENT_MEMORY_RECALL_K:-5}
      # researcher-agent
      RESEARCHER_AGENT_PORT: 8099
      MCP_WEB_URL: http://mcp-web:8098
      MCP_MEDIA_FETCH_URL: http://mcp-media-fetch:8126
      RESEARCHER_AGENT_MCP_CLIENT_ENABLED: ${RESEARCHER_AGENT_MCP_CLIENT_ENABLED:-true}
      RESEARCHER_AGENT_MEMORY_RECALL_K: ${RESEARCHER_AGENT_MEMORY_RECALL_K:-5}
    healthcheck:
      # ALL SIX contexts must answer. Slice 3o's deploy came up with three of five contexts live,
      # and a single-port probe would have reported that healthy.
      test: ["CMD", "bash", "-c", 'for p in 8086 8093 8096 8099 8118 8119; do (exec 3<>/dev/tcp/127.0.0.1/$$p && printf ''GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '') || exit 1; done']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s


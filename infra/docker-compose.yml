# Full local-deployment compose: infra + every Spring Boot service.
#
# Use this when you want the whole system up (e.g. validating end-to-end on
# Mac Studio, or smoke-testing a release). For IDE-driven development you
# usually want docker-compose.dev.yml instead — that one stops at the infra
# layer (postgres + radicale + seaweedfs + one-shot liquibase) so you can run
# the JVMs from IntelliJ pointed at host ports.
#
#   cp .env.example .env                                          # edit if you want non-default ports/passwords
#   docker compose -f docker-compose.yml --profile hot up -d      # always-on HOT set (LC-1)
#   docker compose -f docker-compose.yml --profile hot --profile cold up -d   # everything (full smoke)
#   docker compose -f docker-compose.yml up -d <cold-service>     # start one cold service on demand
#   docker compose -f docker-compose.yml down                     # stop
#   docker compose -f docker-compose.yml down -v                  # nuke volumes too
#
# Every service carries a `profiles: ["hot"|"cold"]` tag (LC-1 hot/cold split, see
# plans/lifecycle.md). A bare `up` (no --profile) starts NOTHING — pass a profile or a name.
#
# Build contexts assume repo root — every Dockerfile copies pom.xml + libs/
# from there, so the compose runs from infra/ but the build context is `..`.
#
# Healthchecks: every Spring Boot app exposes /actuator/health (configured
# in its application.yml). depends_on uses condition: service_healthy so
# downstream services don't start until their dependency is reachable.
# Liquibase runs once and exits 0 — depends_on for app services uses
# condition: service_completed_successfully on that one.
#
# Inter-service URLs are pinned to docker network service names (e.g.
# http://llm-gateway:8081); the matching env vars in .env.example carry
# localhost defaults that suit IDE-driven dev — compose overrides those
# here so the same .env works in both modes.
#
# Port binding (#628): every published host port is bound to ${BIND_ADDR:-127.0.0.1}, i.e.
# loopback-only by default — nothing is reachable from the LAN/tailnet even if the host sits on an
# untrusted network. Off-host access is deliberate and narrow: calendar-web's ICS feed goes out via
# the Tailscale Funnel sidecar (the `tunnel` profile), NOT a wide-open port. If you ever need a port
# on the LAN, set BIND_ADDR (e.g. to a specific tailscale IP) rather than reverting to 0.0.0.0.

name: ai-life

# Heap cap for all in-house JVM services: keeps N Spring Boot apps on a 64 GB host
# from each letting heap grow toward MaxRAMPercentage of *host* RAM under load.
# Conservative/generous default (heap-only, no container mem_limit -> no OOM-from-too-small
# risk); tune on-device with `docker stats`. See plans/lifecycle.md (deploy-mvp).
x-jvm-opts: &jvm-opts "-Xmx768m"

# Shared-secret guard for inter-service /internal/* calls (#630, ADR-0007). Merged into every
# service's environment via `<<: *internal-secret`. Empty by default = guard DISABLED (nothing
# changes); set INTERNAL_SHARED_SECRET in .env to one long random string to turn it on fleet-wide.
# Injected into the infra containers too (they ignore it) — harmless, keeps the merge uniform.
x-internal-secret: &internal-secret
  INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-}

services:
  # ---------- infrastructure ----------

  postgres:
    profiles: ["hot"]
    image: pgvector/pgvector:pg16
    container_name: ai-life-postgres
    restart: unless-stopped
    environment:
      <<: *internal-secret
      POSTGRES_USER: ${POSTGRES_USER:-ailife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      POSTGRES_DB: ${POSTGRES_DB:-ailife}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailife} -d ${POSTGRES_DB:-ailife}"]
      interval: 5s
      timeout: 3s
      retries: 20

  liquibase:
    profiles: ["hot"]
    image: liquibase/liquibase:4.30
    container_name: ai-life-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *internal-secret
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ailife}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ailife}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      # Active Liquibase context filter. MUST be non-empty: an EMPTY filter disables
      # context filtering and runs EVERY changeset (including embed-768) — the opposite
      # of what we want. The default token `default` matches no changeset, so all
      # context-less changesets run while `091-memory-embed-768` (contexts: embed-768)
      # is excluded → mock/dev keeps vector(384). The Mac deploy sets
      # LIQUIBASE_CONTEXTS=default,embed-768 (infra/.env.mac.example) to also run 091
      # and widen memory.memories.embedding to match nomic-embed-text (768-dim).
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
    volumes:
      - ./liquibase:/liquibase/changelog:ro
    command: ["update"]

  # Daily Postgres backups (full-stack / 24-7 only — dev data is disposable, so this is NOT in
  # docker-compose.dev.yml). Reuses the OSS prodrigestivill/postgres-backup-local: schedule +
  # pg_dump + gzip + retention rotation out of the box, no host cron/launchd (works the same on
  # Mac and Windows). One dump of the whole `ailife` DB covers EVERY schema — the ai-life domain
  # schemas AND coding-agent's `code.*` (it shares this instance). POSTGRES_EXTRA_OPTS is set with
  # NO `--schema` filter on purpose, so nothing is left out. Retention = the owner's 7 daily + 4
  # weekly. Restore: see infra/README.md §Database backups.
  postgres-backup:
    profiles: ["hot"]
    image: prodrigestivill/postgres-backup-local:16
    container_name: ai-life-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *internal-secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ailife}
      POSTGRES_USER: ${POSTGRES_USER:-ailife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-0}
      # gzip level 6, restore-friendly (drops objects first), and — critically — no --schema filter.
      POSTGRES_EXTRA_OPTS: ${BACKUP_EXTRA_OPTS:--Z6 --clean --if-exists}
    volumes:
      - ./backups:/backups

  # ---------- off-site backup replication (opt-in `offsite` profile) ----------
  # The postgres-backup sidecar above only writes LOCAL dumps — a lost disk loses them.
  # rclone-offsite pushes those gzipped dumps OFF the box so a single-machine failure isn't a
  # single point of data loss. It sits on its OWN `offsite` profile (like the calendar `tunnel`
  # profile) — NOT `hot` — because it needs a secret (the rclone remote creds) the plain hot
  # bring-up must not require:
  #   docker compose -f docker-compose.yml --profile hot --profile offsite up -d
  #
  # TWO backends, selected by the BACKUP_OFFSITE_REMOTES flag (space-separated list of rclone
  # remote names defined in infra/secrets/rclone.conf). Both are just rclone remotes:
  #   - `yadisk`    — Yandex Disk (rclone `yandex` backend, OAuth)
  #   - `tailscale` — a second host over Tailscale (rclone `sftp` backend to its tailnet name/IP;
  #                   reached via the Docker host, which is itself a tailnet node — no TS sidecar)
  # One name = replicate to that target; several = replicate to each (belt-and-braces). rclone is
  # backend-agnostic, so adding S3/B2/Drive later is just another remote in that file — no compose
  # change. rclone.conf is mounted read-WRITE so rclone can persist a refreshed OAuth token.
  # Set the remotes up once (from infra/, needs a browser for the Yandex OAuth step):
  #   docker run --rm -it -v "$PWD/secrets:/config" -e RCLONE_CONFIG=/config/rclone.conf \
  #     rclone/rclone config     # n) new remote -> name=yadisk storage=yandex ; and/or name=tailscale storage=sftp
  rclone-offsite:
    image: rclone/rclone:1.75
    container_name: ai-life-rclone-offsite
    restart: unless-stopped
    profiles: ["offsite"]
    environment:
      <<: *internal-secret
      RCLONE_CONFIG: /config/rclone.conf
      BACKUP_OFFSITE_REMOTES: ${BACKUP_OFFSITE_REMOTES:-yadisk}
      BACKUP_OFFSITE_PATH: ${BACKUP_OFFSITE_PATH:-ai-life-backups}
      BACKUP_OFFSITE_INTERVAL: ${BACKUP_OFFSITE_INTERVAL:-86400}
    volumes:
      - ./backups:/backups:ro
      # read-write: rclone rewrites the config here when it refreshes the OAuth token.
      - ${BACKUP_OFFSITE_SECRETS_DIR:-./secrets}:/config
    # No host cron: an in-container loop mirrors /backups to each remote on a fixed interval
    # (default daily). rclone sync copies whole gzipped files idempotently, so racing the daily
    # dump — or a remote being briefly unreachable — is harmless (retried next cycle).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[offsite] loop start interval=${BACKUP_OFFSITE_INTERVAL}s remotes='${BACKUP_OFFSITE_REMOTES}' path=${BACKUP_OFFSITE_PATH}"
        while true; do
          for remote in ${BACKUP_OFFSITE_REMOTES}; do
            echo "[offsite] $(date -u +%FT%TZ) sync -> ${remote}:${BACKUP_OFFSITE_PATH}"
            if rclone sync /backups "${remote}:${BACKUP_OFFSITE_PATH}" --stats=0 --stats-one-line; then
              echo "[offsite] $(date -u +%FT%TZ) ${remote} ok"
            else
              echo "[offsite] $(date -u +%FT%TZ) ${remote} FAILED (rc=$?), retry next cycle"
            fi
          done
          sleep "${BACKUP_OFFSITE_INTERVAL}"
        done

  radicale:
    profiles: ["hot"]
    image: tomsquest/docker-radicale:latest
    container_name: ai-life-radicale
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RADICALE_PORT:-5232}:5232"
    volumes:
      - radicale-data:/data
      - ./radicale/config:/etc/radicale/config:ro
    healthcheck:
      # Radicale's image has no bash so the default port-listening check
      # no-ops; hit the web root explicitly.
      test: ["CMD", "curl", "-fsS", "http://localhost:5232/"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Object store for media blobs (S3 API). SeaweedFS, not MinIO: MinIO stopped publishing its server
  # image to any public registry (Docker Hub 401, quay.io 401 since 2026-09-24, ghcr 403), so a fresh
  # host could no longer pull it. SeaweedFS is Apache-2.0, speaks the same S3 API and `server -s3` runs
  # master+volume+filer+S3 in one process — one container, as before.
  # Access keys are enforced via an identity file; it cannot interpolate env, so the entrypoint writes
  # it from the compose vars before exec'ing weed (the credential's visibility in `docker inspect` is
  # the same as MinIO's env vars had).
  seaweedfs:
    profiles: ["hot"]
    image: chrislusf/seaweedfs:4.50
    container_name: ai-life-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/seaweedfs
        printf '%s' '{"identities":[{"name":"ailife","credentials":[{"accessKey":"${S3_ACCESS_KEY:-ailife}","secretKey":"${S3_SECRET_KEY:-ailife-secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    environment:
      <<: *internal-secret
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${S3_API_PORT:-8333}:8333"
      # Filer UI (browse stored objects) — uncomment when you need to look inside.
      # - "${BIND_ADDR:-127.0.0.1}:${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The image is alpine-based; either busybox wget or curl is present, so accept whichever works.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || curl -fsS http://localhost:9333/cluster/status"]
      interval: 30s
      timeout: 5s
      retries: 5

  searxng:
    profiles: ["hot"]
    image: searxng/searxng:latest
    container_name: ai-life-searxng
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    environment:
      <<: *internal-secret
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ailife-dev-secret-change-me}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Whisper ASR sidecar — the real STT engine behind mcp-media-processing's `transcribe`
  # (engine decision LOCKED = sidecar service, polyglot-by-design). Self-hosted OSS, free.
  whisper:
    profiles: ["hot"]
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: ai-life-whisper
    restart: unless-stopped
    environment:
      <<: *internal-secret
      ASR_ENGINE: ${WHISPER_ASR_ENGINE:-faster_whisper}
      ASR_MODEL: ${WHISPER_ASR_MODEL:-base}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WHISPER_PORT:-9100}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Grafana — zero-code finance dashboards over the finance.* matviews (issue #196).
  # Datasource + dashboards are provisioned from infra/grafana (no click-ops).
  grafana:
    profiles: ["cold"]
    # Bumped 11.2.0 → 13.2.4 (2026-10-23). Two majors: nothing here validates it — grafana is a
    # dashboards-only sidecar on an opt-in profile, so the first real bring-up must confirm that
    # provisioning/datasources/postgres.yml still loads (check the container log, then the
    # ai-life folder in the UI). Provisioning stays apiVersion 1 in both files.
    image: grafana/grafana:13.3.0
    container_name: ai-life-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      <<: *internal-secret
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ailife}
      # Consumed by provisioning/datasources/postgres.yml via ${VAR} expansion.
      POSTGRES_USER: ${POSTGRES_USER:-ailife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      POSTGRES_DB: ${POSTGRES_DB:-ailife}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- consolidated resident hosts (ADR-0006 Path B) ----------

  # ONE JVM, five MCP contexts — replaces the former mcp-caldav · mcp-finance · mcp-tasks ·
  # mcp-web · mcp-media-processing services. Each context keeps its own port and its own MCP
  # server, so no contract changed; what changed is that the ~300 MB per-process JVM baseline is
  # paid once instead of five times. Measured 2026-11-02 (#584 slice 3o): 2954 MB across five
  # JVMs -> 828 MB here, the whole JVM-app tier 10039 -> 7920 MB.
  #
  # The five service NAMES are how 14 services address these MCPs (MCP_CALDAV_URL:
  # http://mcp-caldav:8090 and friends, plus every agent's MCP-SSE binding), so this container
  # takes those names as NETWORK ALIASES. Every one of those URLs keeps resolving, unchanged, to
  # the context that owns the port — that is what makes this a packaging change and not a
  # contract change. Keep the alias list equal to DomainMcpHost.RESIDENT_HOT
  # (check-consistency.sh check 18 enforces it).
  #
  # Rollback is `git revert` of this slice: the five module Dockerfiles and their `-exec` jars are
  # untouched, so the separate services still build and run.
  domain-mcp-host:
    profiles: ["hot"]
    image: ai-life/domain-mcp-host:local
    container_name: ai-life-domain-mcp-host
    build:
      context: ..
      dockerfile: deploy/domain-mcp-host/Dockerfile
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mcp-caldav
          - mcp-finance
          - mcp-tasks
          - mcp-web
          - mcp-media-processing
    # The union of the five services' dependencies, with the five themselves gone.
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      radicale:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      searxng:
        condition: service_healthy
      # Not service_healthy: whisper pulls its model on first boot (slow), but ocr/caption must
      # work regardless — transcribe is lazy + best-effort, so don't block on it.
      whisper:
        condition: service_started
    # The union of the five services' environment. It is conflict-free today — SCHEDULER_URL is
    # the only name two members share, with the same value — which is a property to re-check when
    # a member joins, not a guarantee.
    environment:
      <<: *internal-secret
      # Deliberately NOT *jvm-opts (-Xmx768m, sized for one module per process): five contexts
      # share this heap. Provisional headroom, not a target — 3o measured the whole host at
      # 828 MB with ~5 min uptime, and the figure drifts up with use.
      JAVA_TOOL_OPTIONS: "-Xmx2560m"
      MCP_CALDAV_PORT: 8090
      MCP_CALDAV_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ailife}
      MCP_CALDAV_DB_USER: ${POSTGRES_USER:-ailife}
      MCP_CALDAV_DB_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      CALDAV_URL: http://radicale:5232
      CALDAV_USER: ${CALDAV_USER:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      CALDAV_DEFAULT_CALENDAR: ${CALDAV_DEFAULT_CALENDAR:-ours}
      MCP_FINANCE_PORT: 8092
      MCP_FINANCE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ailife}
      MCP_FINANCE_DB_USER: ${POSTGRES_USER:-ailife}
      MCP_FINANCE_DB_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      MCP_FINANCE_BUDGET_CRON: ${MCP_FINANCE_BUDGET_CRON:-0 0 9 * * *}
      MCP_FINANCE_BUDGET_OWNER_AGENT: ${MCP_FINANCE_BUDGET_OWNER_AGENT:-finance}
      MCP_FINANCE_BUDGET_TRIGGER_KIND: ${MCP_FINANCE_BUDGET_TRIGGER_KIND:-budget.alert}
      MCP_FINANCE_RECURRING_OWNER_AGENT: ${MCP_FINANCE_RECURRING_OWNER_AGENT:-finance}
      MCP_FINANCE_RECURRING_TRIGGER_KIND: ${MCP_FINANCE_RECURRING_TRIGGER_KIND:-recurring.due}
      MCP_FINANCE_TRANSACTION_OWNER_AGENT: ${MCP_FINANCE_TRANSACTION_OWNER_AGENT:-finance}
      MCP_FINANCE_TRANSACTION_TRIGGER_KIND: ${MCP_FINANCE_TRANSACTION_TRIGGER_KIND:-transaction.uncategorised}
      MCP_TASKS_PORT: 8095
      MCP_TASKS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ailife}
      MCP_TASKS_DB_USER: ${POSTGRES_USER:-ailife}
      MCP_TASKS_DB_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      MCP_TASKS_REVIEW_CRON: ${MCP_TASKS_REVIEW_CRON:-0 0 9 * * MON}
      MCP_TASKS_REVIEW_OWNER_AGENT: ${MCP_TASKS_REVIEW_OWNER_AGENT:-tasks}
      MCP_TASKS_REVIEW_TRIGGER_KIND: ${MCP_TASKS_REVIEW_TRIGGER_KIND:-weekly.review}
      # Shared by mcp-finance and mcp-tasks — same value, so the union is unambiguous.
      SCHEDULER_URL: http://scheduler-service:8085
      MCP_WEB_PORT: 8098
      SEARXNG_URL: http://searxng:8080
      MCP_MEDIA_PROCESSING_PORT: 8097
      MEDIA_SERVICE_URL: http://media-service:8088
      LLM_GATEWAY_URL: http://llm-gateway:8081
      MCP_MEDIA_PROCESSING_STT_ENGINE: whisper
      WHISPER_ASR_URL: http://whisper:9000
      MCP_MEDIA_PROCESSING_FRAME_EXTRACTOR: ffmpeg
    healthcheck:
      # ALL FIVE contexts must answer, not just one. The 3o deploy came up with three contexts
      # live and the fourth dead; a single-port probe would have called that healthy and let
      # every dependent start against a host missing two MCPs.
      test: ["CMD", "bash", "-c", 'for p in 8090 8092 8095 8097 8098; do (exec 3<>/dev/tcp/127.0.0.1/$$p && printf ''GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep -q '' 200 '') || exit 1; done']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  # ---------- platform services ----------

  llm-gateway:
    profiles: ["hot"]
    image: ai-life/llm-gateway:local
    container_name: ai-life-llm-gateway
    build:
      context: ..
      dockerfile: platform/llm-gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *internal-secret
      JAVA_TOOL_OPTIONS: *jvm-opts
      LLM_GATEWAY_PORT: 8081
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-mock-large}
      # Two-tenant swap (LC-4): off unless the box is shared with the coder contour.
      LLM_MODEL_PROFILE_ENABLED: ${LLM_MODEL_PROFILE_ENABLED:-false}
      LLM_DEFAULT_MODEL_DOWNSHIFT: ${LLM_DEFAULT_MODEL_DOWNSHIFT:-}
      LLM_MODEL_PROFILE_EVICT_TIMEOUT_SECONDS: ${LLM_MODEL_PROFILE_EVICT_TIMEOUT_SECONDS:-120}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-mock-fast}
      # Qwen3 thinks by default. Measured on the deploy box 2026-11-01: 2898 completion tokens
      # against 46 for the same one-sentence answer — so without this the gateway pays ~60x the
      # generation on EVERY call, which is what made a single user message take 23-37 s and blew
      # calendar-agent's 60 s skill-routing budget. It also breaks strict-JSON skill parsing, which
      # is the reason the knob exists (infra/.env.mac.example documents it). It was set in .env all
      # along but never declared here, so it never reached the container.
      LLM_SUPPRESS_THINKING: ${LLM_SUPPRESS_THINKING:-false}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-mock-vision}
      LLM_EMBEDDING_PROVIDER: ${LLM_EMBEDDING_PROVIDER:-mock}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-mock-embed}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_ANTHROPIC_VERSION: ${LLM_ANTHROPIC_VERSION:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LLM_GATEWAY_PORT:-8081}:8081"
    healthcheck:

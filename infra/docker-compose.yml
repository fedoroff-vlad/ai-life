  calendar-web:
    profiles: ["tunnel"]
    image: ai-life/calendar-web:local
    container_name: ai-life-calendar-web
    build:
      context: ..
      dockerfile: platform/calendar-web/Dockerfile
    restart: unless-stopped
    depends_on:
      domain-mcp-host:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    environment:
      <<: *internal-secret
      JAVA_TOOL_OPTIONS: *jvm-opts
      CALENDAR_WEB_PORT: 8113
      MCP_CALDAV_URL: http://mcp-caldav:8090
      PROFILE_SERVICE_URL: http://profile-service:8082

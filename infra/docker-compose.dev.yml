# Local development infrastructure only.
# Brings up Postgres (with pgvector + pg_trgm), Radicale (CalDAV), SeaweedFS (S3-compatible),
# SearXNG, Whisper, and Grafana (zero-code finance dashboards over finance.* matviews).
# Application services (gateway, orchestrator, agents, mcp-*) live in docker-compose.yml,
# added in later PRs. Until then run apps from your IDE pointed at these ports.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml down
#
# Apache AGE (graph extension) will be added in Stage 4 (memory service) via a custom
# Postgres image. For now only pgvector + pg_trgm are enabled — sufficient for Stage 0-3.

name: ai-life-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-life-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ailife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      POSTGRES_DB: ${POSTGRES_DB:-ailife}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailife} -d ${POSTGRES_DB:-ailife}"]
      interval: 5s
      timeout: 3s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.30
    container_name: ai-life-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ailife}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-ailife}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      # Non-empty default `default` keeps context filtering ON (an empty filter would
      # run EVERY changeset incl. embed-768); IDE dev = mock provider = vector(384).
      # See docker-compose.yml for the embed-768 context the Mac deploy activates.
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
    volumes:
      - ./liquibase:/liquibase/changelog:ro
    command: ["update"]

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: ai-life-radicale
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RADICALE_PORT:-5232}:5232"
    volumes:
      - radicale-data:/data
      - ./radicale/config:/etc/radicale/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5232/"]
      interval: 30s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: ai-life-searxng
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ailife-dev-secret-change-me}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Whisper ASR sidecar — real STT engine for an IDE-run mcp-media-processing
  # (point WHISPER_ASR_URL at http://localhost:${WHISPER_PORT}).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: ai-life-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: ${WHISPER_ASR_ENGINE:-faster_whisper}
      ASR_MODEL: ${WHISPER_ASR_MODEL:-base}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WHISPER_PORT:-9100}:9000"

  # S3-API object store for media blobs — SeaweedFS (MinIO no longer publishes public server images;
  # see docker-compose.yml for the full note). `server -s3` = master+volume+filer+S3 in one process.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: ai-life-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /etc/seaweedfs
        printf '%s' '{"identities":[{"name":"ailife","credentials":[{"accessKey":"${S3_ACCESS_KEY:-ailife}","secretKey":"${S3_SECRET_KEY:-ailife-secret}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${S3_API_PORT:-8333}:8333"
      # Filer UI (browse stored objects) — uncomment when you need to look inside.
      # - "${BIND_ADDR:-127.0.0.1}:${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || curl -fsS http://localhost:9333/cluster/status"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Grafana — zero-code finance dashboards over the finance.* matviews (issue #196).
  # Provisioned from infra/grafana; open http://localhost:${GRAFANA_PORT:-3000}.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-life-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ailife}
      POSTGRES_USER: ${POSTGRES_USER:-ailife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailife}
      POSTGRES_DB: ${POSTGRES_DB:-ailife}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  radicale-data:
  seaweedfs-data:
  grafana-data:

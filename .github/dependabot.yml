# Dependency-vulnerability + freshness automation (#629). Dependabot opens PRs for outdated /
# vulnerable dependencies; the owner triages them through the normal branch → PR → green CI flow
# (and the `bump-deps` skill for any coupled SSOT/pin propagation). Weekly + a low PR cap keeps the
# noise bounded. Complements the gitleaks secret-scan job in ci.yml; neither replaces the manual
# scrub-identity discipline.
version: 2
updates:
  # Java dependencies — the root pom carries the dependencyManagement / BOM pins that are the
  # version SSOT for the whole monorepo, so watching the root reactor covers the shared pins.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - tech-debt
      - security
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch the low-risk patch/minor bumps into one PR so routine churn is a single review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Container images. Added 2026-10-12, after a dependency pass found this surface watched by
  # NOTHING: grafana sat two majors behind, liquibase one, rclone several minors. `directories: /**`
  # is needed because the images live in per-module Dockerfiles and in infra/docker-compose*.yml,
  # not at the repo root.
  #
  # Two things this cannot fix, so they stay manual (recorded in .skills/change-map.yaml):
  #  - the four `:latest` images (whisper, searxng, tailscale, radicale) — a floating tag has no
  #    version to bump, and pinning them changes deploy behaviour, so that is an owner decision;
  #  - if Dependabot does not pick up the compose manifests, the third-party images there remain a
  #    hand-maintained pin — check what the first weekly run proposes before trusting this entry.
  - package-ecosystem: docker
    directories:
      - "/**"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - tech-debt
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # LOAD-BEARING PIN, not staleness: the stack is Java 25 LTS (CLAUDE.md §Stack), so the JDK
      # base images move when the project moves to the next LTS — never because a newer tag exists.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  # GitHub Actions — this watches `uses:` refs (checkout@v7, setup-java@v6) and nothing else.
  # NOTE: it does **not** cover the gitleaks release tag, despite what this comment claimed until
  # 2026-10-12 — that version lives in a `run:` step, which Dependabot never rewrites. It is a
  # manual pin, labelled as such in ci.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - tech-debt
    commit-message:
      prefix: "chore(ci)"

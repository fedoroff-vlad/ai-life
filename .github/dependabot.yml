# Dependency-vulnerability + freshness automation (#629). Dependabot opens PRs for outdated /
# vulnerable dependencies; the owner triages them through the normal branch → PR → green CI flow
# (and the `bump-deps` skill for any coupled SSOT/pin propagation). Weekly + a low PR cap keeps the
# noise bounded. Complements the gitleaks secret-scan job in ci.yml; neither replaces the manual
# scrub-identity discipline.
version: 2
updates:
  # Java dependencies — the root pom carries the dependencyManagement / BOM pins that are the
  # version SSOT for the whole monorepo, so watching the root reactor covers the shared pins.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - tech-debt
      - security
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch the low-risk patch/minor bumps into one PR so routine churn is a single review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Container images, second attempt. The first (2026-10-12) used `package-ecosystem: docker` with
  # `directories: ["/**"]` and **errored on every run** — "Error during file fetching; aborting:
  # /** not found": `directories` globs with `*`, and `**` is not a pattern it resolves. Two further
  # things were wrong with that entry, so this is not just a glob fix:
  #  - `docker` reads Dockerfiles, NOT compose manifests. Ours hold only `eclipse-temurin:25-jre` and
  #    `maven:3.9-eclipse-temurin-25`, both pinned to the project's Java LTS (CLAUDE.md §Stack), where
  #    the only update that exists is a major we would ignore by design. A `docker` entry over 50
  #    module directories could therefore never produce a useful PR — it is deliberately NOT re-added.
  #  - the pins worth watching (seaweedfs · grafana · liquibase · rclone · pgvector · postgres-backup)
  #    all live in infra/docker-compose*.yml, which is the separate `docker-compose` ecosystem.
  #
  # Still manual, recorded in .skills/change-map.yaml: the four `:latest` images (whisper, searxng,
  # tailscale, radicale) — a floating tag has no version to bump, and pinning them changes deploy
  # behaviour, so that is an owner decision.
  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - tech-debt
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # LOAD-BEARING PIN, not staleness: liquibase applies the whole schema at stack start, so a
      # major is a "stack does not come up" risk that must be validated by a real bring-up, not
      # merged on a green unit build. Bump it by hand when the deploy host exists (plans/lifecycle.md).
      - dependency-name: liquibase/liquibase
        update-types: ["version-update:semver-major"]

  # GitHub Actions — this watches `uses:` refs (checkout@v7, setup-java@v6) and nothing else.
  # NOTE: it does **not** cover the gitleaks release tag, despite what this comment claimed until
  # 2026-10-12 — that version lives in a `run:` step, which Dependabot never rewrites. It is a
  # manual pin, labelled as such in ci.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - tech-debt
    commit-message:
      prefix: "chore(ci)"
